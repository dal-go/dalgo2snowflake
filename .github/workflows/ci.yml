name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOMAXPROCS: "2"
  GOMEMLIMIT: 768MiB
  GOFLAGS: -mod=readonly
jobs:
  test:
    name: Native protocol, lifecycle and public module checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -race -count=1 -timeout=90s -p=1 ./...
      - run: go vet -p=1 ./...
      - run: go mod verify
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l .)"
      - run: git diff --exit-code -- go.mod go.sum
